name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DSHAFRANOV_APP=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
